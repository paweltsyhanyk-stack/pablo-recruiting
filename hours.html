<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Adex • Облік годин</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: #ffffff;
      --text-main: #1d1d1f;
      --text-secondary: #86868b;
      --accent: #0071e3;
      --border: #d2d2d7;
      --radius: 16px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0; padding: 16px;
      display: flex; justify-content: center;
    }
    .container {
      width: 100%; max-width: 480px;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    h2 { font-size: 20px; margin-top: 0; margin-bottom: 6px; }
    .sheet-badge { font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: 20px; display: block; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    select, input {
      width: 100%; padding: 12px 14px; font-size: 16px;
      border: 1px solid var(--border); border-radius: 12px;
      background: #fafafa; outline: none;
    }
    select:focus, input:focus { background: #fff; border-color: var(--accent); }
    .quick-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    .q-btn {
      padding: 10px; background: #f2f2f7; border: none; border-radius: 10px;
      font-weight: 600; font-size: 14px; cursor: pointer; color: var(--text-main);
    }
    .q-btn:active { background: #e5e5ea; }
    .submit-btn {
      width: 100%; background: var(--accent); color: #fff; border: none;
      border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .submit-btn:disabled { opacity: 0.6; }
    .status { margin-top: 14px; text-align: center; font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Облік годин працівників</h2>
    <span id="sheetTitle" class="sheet-badge">Завантаження даних таблиці...</span>

    <div class="form-group">
      <label for="workerSelect">Працівник</label>
      <select id="workerSelect">
        <option value="">Оберіть працівника...</option>
      </select>
    </div>

    <div class="form-group">
      <label for="daySelect">День місяця</label>
      <select id="daySelect">
        <option value="">Оберіть день...</option>
      </select>
    </div>

    <div class="form-group">
      <label for="valueInput">Години / Статус</label>
      <input type="text" id="valueInput" placeholder="Наприклад: 8:00, 10:00 або W, L4">
    </div>

    <div class="quick-btns">
      <button type="button" class="q-btn" onclick="setValue('8:00')">8:00</button>
      <button type="button" class="q-btn" onclick="setValue('10:00')">10:00</button>
      <button type="button" class="q-btn" onclick="setValue('W')">W</button>
      <button type="button" class="q-btn" onclick="setValue('L4')">L4</button>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="saveHours()">Зберегти в таблицю</button>
    <div id="statusMsg" class="status"></div>
  </div>

  <script>
    // ЗАМІНІТЬ ЦЕЙ РЯДОК НА СВОЄ ПОСИЛАННЯ З GOOGLE APPS SCRIPT
    const API_URL = 'ВАШЕ_ПОСИЛАННЯ_НА_APPS_SCRIPT';
    let globalData = {};

    function setValue(val) {
      document.getElementById('valueInput').value = val;
    }

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        globalData = await res.json();
        
        document.getElementById('sheetTitle'].innerText = 'Активний аркуш: ' + globalData.sheetName;

        const workerSel = document.getElementById('workerSelect');
        workerSel.innerHTML = '<option value="">Оберіть працівника...</option>' + 
          globalData.workers.map(w => `<option value="${w.row}" data-name="${w.name}">${w.name} (Загалом: ${w.total || '0'})</option>`).join('');

        const daySel = document.getElementById('daySelect');
        daySel.innerHTML = '<option value="">Оберіть день...</option>' + 
          globalData.days.map(d => `<option value="${d.colIndex}" data-num="${d.dayNumber}">${d.dayNumber}-е число</option>`).join('');

      } catch (err) {
        document.getElementById('sheetTitle').innerText = 'Помилка завантаження даних';
      }
    }

    async function saveHours() {
      const workerSel = document.getElementById('workerSelect');
      const daySel = document.getElementById('daySelect');
      const valueInput = document.getElementById('valueInput');
      const statusMsg = document.getElementById('statusMsg');
      const btn = document.getElementById('submitBtn');

      const row = workerSel.value;
      const workerOption = workerSel.options[workerSel.selectedIndex];
      const workerName = workerOption.getAttribute('data-name');

      const col = daySel.value;
      const dayOption = daySel.options[daySel.selectedIndex];
      const dayNum = dayOption.getAttribute('data-num');

      const value = valueInput.value.trim();

      if (!row || !col || !value) {
        alert('Будь ласка, заповніть усі поля!');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Збереження...';
      statusMsg.style.color = 'var().text-secondary';
      statusMsg.innerText = 'Оновлюємо таблицю та надсилаємо звіт...';

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ row, col, value, name: workerName, dayNum })
        });

        statusMsg.style.color = '#34c759';
        statusMsg.innerText = '✅ Успішно збережено і відправлено в Telegram!';
        valueInput.value = '';
        setTimeout(() => { statusMsg.innerText = ''; }, 4000);
      } catch (err) {
        statusMsg.style.color = '#ff3b30';
        statusMsg.innerText = '❌ Помилка збереження. Спробуйте ще раз.';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Зберегти в таблицю';
      }
    }

    loadData();
  </script>
</body>
</html>
