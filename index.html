<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pablo Recruiting • Работа в Польше</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: #ffffff;
      --text-main: #1d1d1f;
      --text-secondary: #86868b;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --border: #d2d2d7;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .badge-header {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    .search-box {
      position: relative;
      margin-bottom: 24px;
    }

    .search-input {
      width: 100%;
      padding: 13px 16px 13px 42px;
      font-size: 16px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 14px;
      background: var(--card-bg);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
    }

    .vacancy-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.04);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .card:active {
      transform: scale(0.99);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .card-rate {
      background: #e8f3ff;
      color: var(--accent);
      font-weight: 600;
      font-size: 14px;
      padding: 5px 10px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .card-desc-preview {
      font-size: 15px;
      color: #333336;
      margin: 0 0 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-line;
    }

    .card-actions {
      display: flex;
      gap: 10px;
    }

    .btn-details {
      flex: 1;
      background: #f2f2f7;
      color: var(--text-main);
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-details:hover {
      background: #e5e5ea;
    }

    .apply-btn {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .apply-btn:active {
      transform: scale(0.98);
      background: var(--accent-hover);
    }

    .status-msg {
      text-align: center;
      padding: 40px 20px;
      font-size: 16px;
      color: var(--text-secondary);
    }

    .error-msg {
      color: #ff3b30;
    }

    /* Modal (iOS Sheet Style) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 200;
    }

    @media (min-width: 600px) {
      .modal-overlay {
        align-items: center;
      }
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      border-radius: 22px 22px 0 0;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.15);
      animation: slideUp 0.25s ease-out;
    }

    @media (min-width: 600px) {
      .modal {
        border-radius: 22px;
      }
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.01em;
      padding-right: 10px;
    }

    .close-btn {
      background: #f2f2f7;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex-grow: 1;
      padding-right: 4px;
      margin-bottom: 16px;
    }

    .modal-section {
      background: #f8f8f6;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .modal-section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .modal-section-content {
      font-size: 15px;
      color: var(--text-main);
      font-weight: 500;
      white-space: pre-line;
      line-height: 1.45;
    }

    .selected-vacancy-label {
      font-size: 14px;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 16px;
      background: #f0f7ff;
      padding: 10px 14px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fafafa;
      color: var(--text-main);
      outline: none;
      -webkit-appearance: none;
    }

    .form-control:focus {
      background: #fff;
      border-color: var(--accent);
    }

    .submit-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Pablo Recruiting • Вакансии</div>
    <div class="badge-header">Официальное трудоустройство</div>
  </header>

  <div class="container">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию, клиенту или городу..." oninput="filterVacancies()">
    </div>

    <div id="vacanciesContainer" class="vacancy-list">
      <div class="status-msg">Загрузка актуальных вакансий...</div>
    </div>
  </div>

  <!-- Модальное окно детального просмотра -->
  <div id="detailsModal" class="modal-overlay" onclick="closeDetailsOnOverlay(event)">
    <div class="modal">
      <div class="modal-top">
        <h3 id="detTitle" class="modal-title">Детали вакансии</h3>
        <button class="close-btn" onclick="closeDetailsModal()">✕</button>
      </div>
      <div class="modal-body">
        
        <div class="modal-section" id="clientBlock">
          <div class="modal-section-title">О клиенте / заказчике</div>
          <div id="detClient" class="modal-section-content">-</div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="modal-section">
            <div class="modal-section-title">Локация / Адрес</div>
            <div id="detCity" class="modal-section-content">-</div>
          </div>
          <div class="modal-section">
            <div class="modal-section-title">Ставка</div>
            <div id="detRate" class="modal-section-content" style="color: var(--accent); font-weight: 700;">-</div>
          </div>
        </div>

        <div class="modal-section" id="housingBlock">
          <div class="modal-section-title">Проживание</div>
          <div id="detHousing" class="modal-section-content">-</div>
        </div>

        <div class="modal-section" id="scheduleBlock">
          <div class="modal-section-title">График работы</div>
          <div id="detSchedule" class="modal-section-content">-</div>
        </div>

        <div class="modal-section" id="descBlock">
          <div class="modal-section-title">Обязанности</div>
          <div id="detDesc" class="modal-section-content">-</div>
        </div>

        <div class="modal-section" id="reqBlock">
          <div class="modal-section-title">Требования к кандидатам</div>
          <div id="detReq" class="modal-section-content">-</div>
        </div>

      </div>
      <button class="submit-btn" onclick="applyFromDetails()">Подать заявку</button>
    </div>
  </div>

  <!-- Модальное окно отклика -->
  <div id="applyModal" class="modal-overlay" onclick="closeApplyOnOverlay(event)">
    <div class="modal">
      <div class="modal-top">
        <h3 class="modal-title">Откликнуться на вакансию</h3>
        <button class="close-btn" onclick="closeApplyModal()">✕</button>
      </div>
      <div id="modalVacancyTitle" class="selected-vacancy-label"></div>

      <div class="modal-body" style="overflow-y: visible;">
        <div class="form-group">
          <label for="applicantName">Ваше имя и фамилия *</label>
          <input type="text" id="applicantName" class="form-control" placeholder="Например: Александр Коваль">
        </div>

        <div class="form-group">
          <label for="applicantPhone">Телефон (Viber / Telegram) *</label>
          <input type="tel" id="applicantPhone" class="form-control" placeholder="+48 000 000 000">
        </div>

        <div class="form-group">
          <label for="applicantComment">Комментарий (возраст, город, документы)</label>
          <textarea id="applicantComment" class="form-control" rows="3" placeholder="Например: Уже в Польше, готов выйти с понедельника"></textarea>
        </div>
      </div>

      <button class="submit-btn" onclick="submitForm()">Отправить заявку</button>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyGfYowwhe5y3NVYt1m8L5WzSrdvoqWIzOAcb7-fElV6FR23f6buSKOYFH9lamfl3gCmg/exec';
    let allVacancies = [];
    let selectedVacancy = '';

    // Надёжный универсальный извлекатель данных (работает с объектами и массивами любого порядка)
    function getAttr(v, keys, indices) {
      if (!v) return '';
      
      // Если пришел объект (словарь по ключам колонок)
      if (typeof v === 'object' && !Array.isArray(v)) {
        for (let k of keys) {
          for (let col in v) {
            if (col.toLowerCase().includes(k.toLowerCase())) {
              let val = v[col];
              if (val != null && String(val).trim() !== '' && String(val).trim() !== 'Активна') {
                return String(val).trim();
              }
            }
          }
        }
      }
      
      // Если пришел массив (строка из таблицы по индексам)
      if (Array.isArray(v)) {
        if (indices) {
          for (let idx of indices) {
            if (v[idx] !== undefined && v[idx] !== null) {
              let val = String(v[idx]).trim();
              if (val !== '' && val !== 'Активна' && !val.startsWith('VAC-')) {
                return val;
              }
            }
          }
        }
        // Поиск по ключевым словам внутри элементов массива
        for (let item of v) {
          if (item != null) {
            let s = String(item).trim();
            if (keys.some(k => s.toLowerCase().includes(k.toLowerCase()))) {
              return s;
            }
          }
        }
      }
      return '';
    }

    async function loadVacancies() {
      const container = document.getElementById('vacanciesContainer');
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('Network error');
        const data = await response.json();
        
        let rawList = [];
        if (Array.isArray(data)) {
          rawList = data;
        } else if (data && typeof data === 'object') {
          rawList = data.vacancies || data.data || data.items || Object.values(data).find(Array.isArray) || [];
        }
        
        // Фильтруем шапку и пустые строки
        allVacancies = rawList.filter(v => {
          if (!v) return false;
          let title = getAttr(v, ['назв', 'title', 'ваканс'], [1]);
          let lower = title.toLowerCase();
          if (!title || lower.includes('назва') || lower.includes('id') || lower.includes('всего вакансий')) {
            return false;
          }
          return true;
        });

        // Fallback, если список пуст
        if (allVacancies.length === 0 && rawList.length > 0) {
          allVacancies = rawList.filter(v => {
            let s = JSON.stringify(v).toLowerCase();
            return !s.includes('назва вакансії') && !s.includes('категорія') && !s.includes('всего вакансий');
          });
          if (allVacancies.length === 0) allVacancies = rawList;
        }

        renderVacancies(allVacancies);
      } catch (error) {
        console.error(error);
        container.innerHTML = '<div class="status-msg error-msg">Не удалось загрузить вакансии. Попробуйте позже.</div>';
      }
    }

    function renderVacancies(list) {
      const container = document.getElementById('vacanciesContainer');
      if (!list || list.length === 0) {
        container.innerHTML = '<div class="status-msg">Сейчас активных вакансий не найдено.</div>';
        return;
      }

      container.innerHTML = list.map((v, index) => {
        const title = getAttr(v, ['назв', 'title', 'ваканс'], [1]) || 'Вакансия';
        const client = getAttr(v, ['клиент', 'client', 'компан', 'опис клієнта'], [2]);
        const city = getAttr(v, ['міст', 'город', 'miasto', 'city', 'адрес'], [3]);
        let rate = getAttr(v, ['ставк', 'stawka', 'rate', 'zł'], [4]);
        if (!rate) {
          // Ищем то, что содержит zł
          let jsonStr = JSON.stringify(v);
          let match = jsonStr.match(/[\d.,]+\s*(?:zł|зл)/i);
          rate = match ? match[0] : 'По договоренности';
        }
        const housing = getAttr(v, ['житл', 'прожив', 'zakwaterowanie', 'housing'], [5]);
        const desc = getAttr(v, ['опис', 'описан', 'opis', 'desc', 'обов'], [7]);

        return `
          <div class="card" onclick="openDetails(${index})">
            <div class="card-header">
              <h2 class="card-title">${title}</h2>
              ${rate ? `<span class="card-rate">${rate}</span>` : ''}
            </div>
            <div class="card-meta">
              ${city ? `<span>📍 ${city}</span>` : ''}
              ${housing ? `<span>🏠 ${housing}</span>` : ''}
            </div>
            ${client ? `<div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500;">🏢 ${client}</div>` : ''}
            ${desc ? `<p class="card-desc-preview">${desc}</p>` : ''}
            <div class="card-actions" onclick="event.stopPropagation()">
              <button class="btn-details" onclick="openDetails(${index})">Подробнее</button>
              <button class="apply-btn" onclick="openApplyModal('${title.replace(/'/g, "\\'")}')">Подать заявку</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterVacancies() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = allVacancies.filter(v => {
        const title = getAttr(v, ['назв', 'title', 'ваканс'], [1]).toLowerCase();
        const client = getAttr(v, ['клиент', 'client', 'компан', 'опис клієнта'], [2]).toLowerCase();
        const city = getAttr(v, ['міст', 'город', 'miasto', 'city', 'адрес'], [3]).toLowerCase();
        const desc = getAttr(v, ['опис', 'описан', 'opis', 'desc', 'обов'], [7]).toLowerCase();
        return title.includes(query) || client.includes(query) || city.includes(query) || desc.includes(query);
      });
      renderVacancies(filtered);
    }

    function openDetails(index) {
      const v = allVacancies[index];
      if (!v) return;
      selectedVacancy = getAttr(v, ['назв', 'title', 'ваканс'], [1]) || 'Вакансия';
      
      document.getElementById('detTitle').innerText = selectedVacancy;
      
      const client = getAttr(v, ['клиент', 'client', 'компан', 'опис клієнта'], [2]);
      const clientBlock = document.getElementById('clientBlock');
      if (client) {
        document.getElementById('detClient').innerText = client;
        clientBlock.style.display = 'block';
      } else {
        clientBlock.style.display = 'none';
      }

      document.getElementById('detCity').innerText = getAttr(v, ['міст', 'город', 'miasto', 'city', 'адрес'], [3]) || 'Польша';
      
      let rate = getAttr(v, ['ставк', 'stawka', 'rate', 'zł'], [4]);
      if (!rate) {
        let jsonStr = JSON.stringify(v);
        let match = jsonStr.match(/[\d.,]+\s*(?:zł|зл)/i);
        rate = match ? match[0] : 'По договоренности';
      }
      document.getElementById('detRate').innerText = rate;

      const housing = getAttr(v, ['житл', 'прожив', 'zakwaterowanie', 'housing'], [5]);
      const housingBlock = document.getElementById('housingBlock');
      if (housing) {
        document.getElementById('detHousing').innerText = housing;
        housingBlock.style.display = 'block';
      } else {
        housingBlock.style.display = 'none';
      }

      const schedule = getAttr(v, ['графік', 'график', 'schedule', 'годин'], [6]);
      const scheduleBlock = document.getElementById('scheduleBlock');
      if (schedule) {
        document.getElementById('detSchedule').innerText = schedule;
        scheduleBlock.style.display = 'block';
      } else {
        scheduleBlock.style.display = 'none';
      }

      const desc = getAttr(v, ['опис', 'описан', 'opis', 'desc', 'обов'], [7]);
      const descBlock = document.getElementById('descBlock');
      if (desc) {
        document.getElementById('detDesc').innerText = desc;
        descBlock.style.display = 'block';
      } else {
        descBlock.style.display = 'none';
      }

      const req = getAttr(v, ['вимог', 'требован', 'req', 'умов'], [8]);
      const reqBlock = document.getElementById('reqBlock');
      if (req) {
        document.getElementById('detReq').innerText = req;
        reqBlock.style.display = 'block';
      } else {
        reqBlock.style.display = 'none';
      }

      document.getElementById('detailsModal').classList.add('active');
    }

    function closeDetailsModal() {
      document.getElementById('detailsModal').classList.remove('active');
    }

    function closeDetailsOnOverlay(e) {
      if (e.target.id === 'detailsModal') closeDetailsModal();
    }

    function applyFromDetails() {
      closeDetailsModal();
      openApplyModal(selectedVacancy);
    }

    function openApplyModal(title) {
      selectedVacancy = title;
      document.getElementById('modalVacancyTitle').innerText = 'Вакансия: ' + title;
      document.getElementById('applyModal').classList.add('active');
    }

    function closeApplyModal() {
      document.getElementById('applyModal').classList.remove('active');
    }

    function closeApplyOnOverlay(e) {
      if (e.target.id === 'applyModal') closeApplyModal();
    }

    function submitForm() {
      const name = document.getElementById('applicantName').value.trim();
      const phone = document.getElementById('applicantPhone').value.trim();
      const comment = document.getElementById('applicantComment').value.trim();

      if (!name || !phone) {
        alert('Пожалуйста, укажите ваше имя и контактный телефон!');
        return;
      }

      const btn = document.querySelector('#applyModal .submit-btn');
      btn.innerText = 'Отправка...';
      btn.disabled = true;

      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          vacancyTitle: selectedVacancy,
          name: name,
          phone: phone,
          comment: comment
        })
      })
      .then(() => {
        alert('✅ Спасибо! Ваша заявка успешно отправлена. Координатор свяжется с вами в ближайшее время.');
        document.getElementById('applicantName').value = '';
        document.getElementById('applicantPhone').value = '';
        document.getElementById('applicantComment').value = '';
        closeApplyModal();
      })
      .catch(() => {
        alert('Произошла ошибка при отправке. Попробуйте ещё раз.');
      })
      .finally(() => {
        btn.innerText = 'Отправить заявку';
        btn.disabled = false;
      });
    }

    loadVacancies();
  </script>
</body>
</html>
