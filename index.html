<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pablo Recruiting • Вакансии в Польше</title>
  <style>
    :root {
      --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --subtext: #6e6e73;
      --accent: #0071e3; --accent-hover: #0077ed; --border: #e5e5ea;
      --pill-bg: #f2f2f7; --radius: 20px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; line-height: 1.45; }
    header { background: rgba(255,255,255,.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); padding: 16px 20px; }
    .header-inner { max-width: 820px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .logo { font-size: 19px; font-weight: 700; letter-spacing: -.3px; }
    .logo span { color: var(--accent); }
    .container { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
    .search-box { margin-bottom: 20px; }
    .search-input { width: 100%; padding: 14px 18px; font-size: 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); outline: none; box-shadow: 0 2px 10px rgba(0,0,0,.02); }
    .search-input:focus { border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .card { background: var(--card); border-radius: var(--radius); padding: 22px; box-shadow: 0 4px 20px rgba(0,0,0,.04); border: 1px solid rgba(0,0,0,.03); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .vac-title { font-size: 18px; font-weight: 700; margin: 0; white-space: pre-line; }
    .rate-badge { background: #e8f3ff; color: var(--accent); font-weight: 700; font-size: 15px; padding: 6px 12px; border-radius: 10px; white-space: nowrap; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .tag { background: var(--pill-bg); color: var(--text); font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 8px; }
    .card-desc { font-size: 14px; color: var(--subtext); margin-bottom: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .btn { width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .65; cursor: wait; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: flex-end; z-index: 100; }
    @media (min-width: 600px) { .modal-overlay { align-items: center; padding: 20px; } }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 24px; position: relative; }
    @media (min-width: 600px) { .modal { border-radius: 24px; } }
    .close-btn { position: sticky; top: 0; float: right; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--pill-bg); font-size: 18px; cursor: pointer; color: var(--subtext); z-index: 10; }
    .modal-title { font-size: 20px; font-weight: 700; margin: 0 36px 16px 0; white-space: pre-line; }
    .info-block { background: #f9f9fb; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
    .info-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--subtext); margin-bottom: 6px; }
    .info-text { font-size: 14px; color: var(--text); white-space: pre-line; overflow-wrap: anywhere; }
    .apply-form { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); display: none; }
    .apply-form.active { display: block; }
    .form-input { width: 100%; padding: 12px 14px; font-size: 15px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; font-family: inherit; }
    .loader { text-align: center; padding: 40px; color: var(--subtext); font-size: 15px; }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">Pablo <span>Recruiting</span></div>
    <div style="font-size:13px;color:var(--subtext);">Актуальные вакансии</div>
  </div>
</header>
<div class="container">
  <div class="search-box">
    <input type="search" id="searchInput" class="search-input" placeholder="Поиск по должности или городу..." aria-label="Поиск вакансий">
  </div>
  <div id="vacanciesList" class="grid" aria-live="polite"><div class="loader">Загрузка актуальных вакансий...</div></div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="close-btn" id="closeModalBtn" type="button" aria-label="Закрыть">✕</button>
    <h3 class="modal-title" id="mTitle"></h3>
    <div class="tags" id="mTags"></div>
    <div class="info-block" id="mClientBlock"><div class="info-label">О клиенте / заказчике</div><div class="info-text" id="mClientDesc"></div></div>
    <div class="info-block" id="mCityBlock"><div class="info-label">Локация / Адрес</div><div class="info-text" id="mCity"></div></div>
    <div class="info-block" id="mRateBlock"><div class="info-label">Ставка</div><div class="info-text" id="mRate"></div></div>
    <div class="info-block" id="mHousingBlock"><div class="info-label">Проживание</div><div class="info-text" id="mHousing"></div></div>
    <div class="info-block" id="mScheduleBlock"><div class="info-label">График работы</div><div class="info-text" id="mSchedule"></div></div>
    <div class="info-block" id="mDutiesBlock"><div class="info-label">Обязанности</div><div class="info-text" id="mDuties"></div></div>
    <div class="info-block" id="mReqBlock"><div class="info-label">Требования к кандидатам</div><div class="info-text" id="mRequirements"></div></div>
    <button class="btn" id="showFormBtn" type="button">Подать заявку</button>
    <div class="apply-form" id="applyForm">
      <div class="info-label" style="margin-bottom:10px;">Оставьте контакты — мы свяжемся с вами</div>
      <input type="text" id="candName" class="form-input" placeholder="Ваше имя и фамилия *" autocomplete="name" required>
      <input type="tel" id="candPhone" class="form-input" placeholder="Номер телефона (Viber / Telegram) *" autocomplete="tel" required>
      <textarea id="candComment" class="form-input" rows="2" placeholder="Кратко об опыте работы (необязательно)"></textarea>
      <button class="btn" id="sendAppBtn" type="button">Отправить заявку</button>
      <div id="appStatus" role="status" aria-live="polite" style="margin-top:10px;font-size:14px;text-align:center;font-weight:500;"></div>
    </div>
  </div>
</div>
<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbyGfYowwhe5y3NVYt1m8L5WzSrdvoqWIzOAcb7-fElV6FR23f6buSKOYFH9lamfl3gCmg/exec';
  let allVacancies = [];
  let selectedVacancy = null;

  const $ = id => document.getElementById(id);
  const asText = value => value == null ? '' : String(value).trim();
  const normalize = value => asText(value).toLocaleLowerCase();

  function getFilteredVacancies() {
    const query = normalize($('searchInput').value);
    if (!query) return allVacancies;
    return allVacancies.filter(v => [v.title, v.city, v.duties].some(value => normalize(value).includes(query)));
  }

  async function loadVacancies() {
    const container = $('vacanciesList');
    try {
      const response = await fetch(API_URL, { method: 'GET', cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      // Accept either a plain array or a common { vacancies: [...] } API response.
      const vacancies = Array.isArray(data) ? data : data && Array.isArray(data.vacancies) ? data.vacancies : null;
      if (!vacancies) throw new Error('Invalid vacancies response');
      allVacancies = vacancies.filter(v => v && typeof v === 'object').map(v => ({
        ...v,
        id: asText(v.id), title: asText(v.title), city: asText(v.city), rate: asText(v.rate),
        housing: asText(v.housing), clientDesc: asText(v.clientDesc), schedule: asText(v.schedule),
        duties: asText(v.duties), requirements: asText(v.requirements)
      }));
      renderVacancies(getFilteredVacancies());
    } catch (error) {
      console.error('Failed to load vacancies:', error);
      container.innerHTML = '<div class="loader">Не удалось загрузить вакансии. Проверьте подключение и попробуйте обновить страницу.</div>';
    }
  }

  function renderVacancies(list) {
    const container = $('vacanciesList');
    if (!list.length) {
      container.innerHTML = '<div class="loader">По вашему запросу вакансий не найдено.</div>';
      return;
    }
    container.innerHTML = list.map((v, index) => `
      <article class="card">
        <div class="card-top"><h3 class="vac-title">${escapeHtml(v.title || 'Вакансия')}</h3>
          ${v.rate ? `<div class="rate-badge">${escapeHtml(v.rate)}</div>` : ''}
        </div>
        <div class="tags">
          ${v.city ? `<span class="tag">📍 ${escapeHtml(v.city)}</span>` : ''}
          ${v.housing ? `<span class="tag">🏠 Жилье: ${escapeHtml(v.housing)}</span>` : ''}
        </div>
        ${v.clientDesc ? `<div class="card-desc">${escapeHtml(v.clientDesc)}</div>` : ''}
        <button class="btn vacancy-button" type="button" data-index="${index}">Подробнее и откликнуться</button>
      </article>`).join('');
    container.querySelectorAll('.vacancy-button').forEach(button => {
      button.addEventListener('click', () => openModal(Number(button.dataset.index)));
    });
  }

  function filterVacancies() { renderVacancies(getFilteredVacancies()); }

  function openModal(index) {
    selectedVacancy = getFilteredVacancies()[index];
    if (!selectedVacancy) return;
    $('mTitle').textContent = selectedVacancy.title || 'Вакансия';
    $('mTags').innerHTML = [
      selectedVacancy.city && `<span class="tag">📍 ${escapeHtml(selectedVacancy.city)}</span>`,
      selectedVacancy.rate && `<span class="tag">💰 ${escapeHtml(selectedVacancy.rate)}</span>`,
      selectedVacancy.housing && `<span class="tag">🏠 ${escapeHtml(selectedVacancy.housing)}</span>`
    ].filter(Boolean).join('');
    toggleBlock('mClientBlock', 'mClientDesc', selectedVacancy.clientDesc);
    toggleBlock('mCityBlock', 'mCity', selectedVacancy.city);
    toggleBlock('mRateBlock', 'mRate', selectedVacancy.rate);
    toggleBlock('mHousingBlock', 'mHousing', selectedVacancy.housing);
    toggleBlock('mScheduleBlock', 'mSchedule', selectedVacancy.schedule);
    toggleBlock('mDutiesBlock', 'mDuties', selectedVacancy.duties);
    toggleBlock('mReqBlock', 'mRequirements', selectedVacancy.requirements);
    $('applyForm').classList.remove('active');
    $('showFormBtn').hidden = false;
    $('appStatus').textContent = '';
    $('candName').value = '';
    $('candPhone').value = '';
    $('candComment').value = '';
    $('modalOverlay').classList.add('active');
    $('closeModalBtn').focus();
  }

  function toggleBlock(blockId, textId, value) {
    const text = asText(value);
    $(blockId).hidden = !text;
    if (text) $(textId).textContent = text;
  }

  function closeModal() {
    $('modalOverlay').classList.remove('active');
    selectedVacancy = null;
  }

  function showApplyForm() {
    $('showFormBtn').hidden = true;
    $('applyForm').classList.add('active');
    $('candName').focus();
  }

  async function submitApplication() {
    if (!selectedVacancy) return;
    const name = $('candName').value.trim();
    const phone = $('candPhone').value.trim();
    const comment = $('candComment').value.trim();
    const status = $('appStatus');
    const button = $('sendAppBtn');
    if (!name || !phone) {
      status.style.color = '#ff3b30';
      status.textContent = 'Пожалуйста, укажите ваше имя и номер телефона.';
      (!name ? $('candName') : $('candPhone')).focus();
      return;
    }

    button.disabled = true;
    button.textContent = 'Отправка...';
    status.style.color = '#6e6e73';
    status.textContent = 'Отправляем вашу заявку...';
    const payload = {
      vacancyId: selectedVacancy.id,
      vacancyTitle: selectedVacancy.title,
      city: selectedVacancy.city,
      name, phone, comment
    };

    try {
      // text/plain avoids a CORS preflight; Apps Script can read the JSON from e.postData.contents.
      // no-cors responses are opaque, so the browser cannot verify server-side processing.
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify(payload)
      });
      status.style.color = '#34a853';
      status.textContent = '✅ Заявка отправлена. Если с вами не свяжутся, пожалуйста, попробуйте ещё раз.';
    } catch (error) {
      console.error('Failed to submit application:', error);
      status.style.color = '#ff3b30';
      status.textContent = '❌ Не удалось отправить заявку. Проверьте подключение и попробуйте ещё раз.';
    } finally {
      button.disabled = false;
      button.textContent = 'Отправить заявку';
    }
  }

  function escapeHtml(value) {
    return asText(value).replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
  }

  $('searchInput').addEventListener('input', filterVacancies);
  $('closeModalBtn').addEventListener('click', closeModal);
  $('showFormBtn').addEventListener('click', showApplyForm);
  $('sendAppBtn').addEventListener('click', submitApplication);
  $('modalOverlay').addEventListener('click', event => {
    if (event.target === $('modalOverlay')) closeModal();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && $('modalOverlay').classList.contains('active')) closeModal();
  });

  loadVacancies();
</script>
</body>
</html>
