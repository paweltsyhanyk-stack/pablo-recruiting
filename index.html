<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pablo Recruiting • Работа в Польше</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: #ffffff;
      --text-main: #1d1d1f;
      --text-secondary: #86868b;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --border: #d2d2d7;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .badge-header {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    .search-box {
      position: relative;
      margin-bottom: 24px;
    }

    .search-input {
      width: 100%;
      padding: 13px 16px 13px 42px;
      font-size: 16px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 14px;
      background: var(--card-bg);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
    }

    .vacancy-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.04);
      transition: transform 0.15s ease;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .card-rate {
      background: #e8f3ff;
      color: var(--accent);
      font-weight: 600;
      font-size: 14px;
      padding: 5px 10px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .card-desc {
      font-size: 15px;
      color: #333336;
      margin: 0 0 16px;
      white-space: pre-line;
    }

    .apply-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .apply-btn:active {
      transform: scale(0.98);
      background: var(--accent-hover);
    }

    .status-msg {
      text-align: center;
      padding: 40px 20px;
      font-size: 16px;
      color: var(--text-secondary);
    }

    .error-msg {
      color: #ff3b30;
    }

    /* Modal (iOS Sheet Style) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 200;
    }

    @media (min-width: 600px) {
      .modal-overlay {
        align-items: center;
      }
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      width: 100%;
      max-width: 460px;
      border-radius: 22px 22px 0 0;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.15);
      animation: slideUp 0.25s ease-out;
    }

    @media (min-width: 600px) {
      .modal {
        border-radius: 20px;
        padding: 26px;
      }
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 700;
      margin: 0;
    }

    .close-btn {
      background: #f2f2f7;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 18px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .selected-vacancy-label {
      font-size: 14px;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 16px;
      background: #f0f7ff;
      padding: 8px 12px;
      border-radius: 10px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fafafa;
      color: var(--text-main);
      outline: none;
      -webkit-appearance: none;
    }

    .form-control:focus {
      background: #fff;
      border-color: var(--accent);
    }

    .submit-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Pablo Recruiting • Вакансии</div>
    <div class="badge-header">Официальное трудоустройство</div>
  </header>

  <div class="container">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию или городу..." oninput="filterVacancies()">
    </div>

    <div id="vacanciesContainer" class="vacancy-list">
      <div class="status-msg">Загрузка актуальных вакансий...</div>
    </div>
  </div>

  <!-- Модальное окно отклика -->
  <div id="applyModal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal">
      <div class="modal-top">
        <h3 class="modal-title">Откликнуться на вакансию</h3>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div id="modalVacancyTitle" class="selected-vacancy-label"></div>

      <div class="form-group">
        <label for="applicantName">Ваше имя и фамилия *</label>
        <input type="text" id="applicantName" class="form-control" placeholder="Например: Александр Коваль">
      </div>

      <div class="form-group">
        <label for="applicantPhone">Телефон (Viber / Telegram) *</label>
        <input type="tel" id="applicantPhone" class="form-control" placeholder="+48 000 000 000">
      </div>

      <div class="form-group">
        <label for="applicantComment">Комментарий (возраст, город, документы)</label>
        <textarea id="applicantComment" class="form-control" rows="3" placeholder="Например: Уже в Польше, готов выйти с понедельника"></textarea>
      </div>

      <button class="submit-btn" onclick="submitForm()">Отправить заявку</button>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyGfYowwhe5y3NVYt1m8L5WzSrdvoqWIzOAcb7-fElV6FR23f6buSKOYFH9lamfl3gCmg/exec';
    let allVacancies = [];
    let selectedVacancy = '';

    async function loadVacancies() {
      const container = document.getElementById('vacanciesContainer');
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('Network error');
        const data = await response.json();
        allVacancies = Array.isArray(data) ? data : (data.vacancies || []);
        renderVacancies(allVacancies);
      } catch (error) {
        console.error(error);
        container.innerHTML = '<div class="status-msg error-msg">Не удалось загрузить вакансии. Проверьте доступ к Google Apps Script или попробуйте позже.</div>';
      }
    }

    function renderVacancies(list) {
      const container = document.getElementById('vacanciesContainer');
      if (!list || list.length === 0) {
        container.innerHTML = '<div class="status-msg">Сейчас активных вакансий не найдено.</div>';
        return;
      }

      container.innerHTML = list.map(v => {
        const title = v.title || v.Nazwa || 'Вакансия';
        const city = v.city || v.Miasto || 'Польша';
        const rate = v.rate || v.Stawka || '';
        const housing = v.housing || v.Zakwaterowanie || '';
        const desc = v.description || v.Opis || '';
        const safeTitle = title.replace(/'/g, "\\'");

        return `
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">${title}</h2>
              ${rate ? `<span class="card-rate">${rate}</span>` : ''}
            </div>
            <div class="card-meta">
              <span>📍 ${city}</span>
              ${housing ? `<span>🏠 ${housing}</span>` : ''}
            </div>
            ${desc ? `<p class="card-desc">${desc}</p>` : ''}
            <button class="apply-btn" onclick="openModal('${safeTitle}')">Подать заявку</button>
          </div>
        `;
      }).join('');
    }

    function filterVacancies() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = allVacancies.filter(v => {
        const title = (v.title || v.Nazwa || '').toLowerCase();
        const city = (v.city || v.Miasto || '').toLowerCase();
        const desc = (v.description || v.Opis || '').toLowerCase();
        return title.includes(query) || city.includes(query) || desc.includes(query);
      });
      renderVacancies(filtered);
    }

    function openModal(title) {
      selectedVacancy = title;
      document.getElementById('modalVacancyTitle').innerText = 'Вакансия: ' + title;
      document.getElementById('applyModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('applyModal').classList.remove('active');
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === 'applyModal') closeModal();
    }

    function submitForm() {
      const name = document.getElementById('applicantName').value.trim();
      const phone = document.getElementById('applicantPhone').value.trim();
      const comment = document.getElementById('applicantComment').value.trim();

      if (!name || !phone) {
        alert('Пожалуйста, укажите ваше имя и контактный телефон!');
        return;
      }

      const btn = document.querySelector('.submit-btn');
      btn.innerText = 'Отправка...';
      btn.disabled = true;

      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          vacancyTitle: selectedVacancy,
          name: name,
          phone: phone,
          comment: comment
        })
      })
      .then(() => {
        alert('✅ Спасибо! Ваша заявка успешно отправлена. Координатор свяжется с вами в ближайшее время.');
        document.getElementById('applicantName').value = '';
        document.getElementById('applicantPhone').value = '';
        document.getElementById('applicantComment').value = '';
        closeModal();
      })
      .catch(() => {
        alert('Произошла ошибка при отправке. Попробуйте ещё раз.');
      })
      .finally(() => {
        btn.innerText = 'Отправить заявку';
        btn.disabled = false;
      });
    }

    loadVacancies();
  </script>
</body>
</html>
</body>
</html>
