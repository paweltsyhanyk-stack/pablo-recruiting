<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kono Jobs • Робота в Польщі</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --border: #d2d2d7;
            --radius: 14px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        header span {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px;
        }
        .search-box {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
        }
        .search-box:focus {
            border-color: var(--accent);
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.02);
        }
        .card-title {
            font-size: 17px;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: var(--text-main);
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .tag {
            background: #f2f2f7;
            color: #3a3a3c;
            font-size: 11.5px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 500;
        }
        .tag.salary {
            background: #e1f5fe;
            color: #0288d1;
            font-weight: 600;
        }
        .card-desc {
            font-size: 13.5px;
            color: #515154;
            line-height: 1.4;
            margin-bottom: 16px;
        }
        .apply-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .apply-btn:hover {
            background-color: #0077ed;
        }
        /* Модальне вікно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .modal-content h3 {
            margin-top: 0;
            font-size: 18px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 500;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group textarea {
            resize: vertical;
            height: 70px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .cancel-btn {
            background: #e5e5ea;
            color: #1d1d1f;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }
        .submit-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }
        .loading, .error-msg {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        .error-msg { color: #ff3b30; }
    </style>
</head>
<body>

    <header>
        <h1>Kono Jobs • Вакансії</h1>
        <span>Офіційне працевлаштування</span>
    </header>

    <div class="container">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Пошук за назвою або містом..." onkeyup="filterVacancies()">
        <div id="vacanciesList">
            <div class="loading">Завантаження актуальних вакансій...</div>
        </div>
    </div>

    <!-- Модальне вікно відгуку -->
    <div id="applyModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Відгукнутися</h3>
            <div class="form-group">
                <label>Ваше ім'я та прізвище</label>
                <input type="text" id="applicantName" placeholder="Андрій Шевченко">
            </div>
            <div class="form-group">
                <label>Телефон / Telegram / Viber</label>
                <input type="text" id="applicantPhone" placeholder="+48 123 456 789">
            </div>
            <div class="form-group">
                <label>Коментар (необов'язково)</label>
                <textarea id="applicantComment" placeholder="Коли готові вийти на роботу?"></textarea>
            </div>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeModal()">Скасувати</button>
                <button class="submit-btn" onclick="submitForm()">Відправити</button>
            </div>
        </div>
    </div>

    <script>
        // Вставте сюди ваше актуальне посилання на розгорнутий Apps Script (що закінчується на /exec)
        const API_URL = 'https://script.google.com/macros/s/AKfycbyGfYowwhe5y3NVYt1m8L5WzSrdvoqWIzOAcb7-fElV6FR23f6buSKOYFH9lamfl3gCmg/exec';

        let allVacancies = [];
        let selectedVacancy = '';

        window.onload = function() {
            fetchVacancies();
        };

        function fetchVacancies() {
            // Запит до Google Таблиці через Apps Script Web App
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    allVacancies = data;
                    renderVacancies(data);
                })
                .catch(err => {
                    document.getElementById('vacanciesList').innerHTML = '<div class="error-msg">Не вдалося завантажити вакансії. Спробуйте пізніше.</div>';
                });
        }

        function renderVacancies(vacancies) {
            const listEl = document.getElementById('vacanciesList');
            if (!vacancies || vacancies.length === 0) {
                listEl.innerHTML = '<div class="loading">Актуальних вакансій наразі немає.</div>';
                return;
            }

            let html = '';
            vacancies.forEach(v => {
                html += `
                    <div class="card">
                        <h2 class="card-title">${v.title}</h2>
                        <div class="tags">
                            <span class="tag">📍 ${v.city}</span>
                            <span class="tag salary">💵 ${v.salary}</span>
                            <span class="tag">🏠 ${v.housing}</span>
                            <span class="tag">⏱ ${v.schedule}</span>
                        </div>
                        <div class="card-desc">${v.description}</div>
                        <button class="apply-btn" onclick="openModal('${v.title}')">Відгукнутися на вакансію</button>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function filterVacancies() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allVacancies.filter(v => 
                v.title.toLowerCase().includes(query) || 
                v.city.toLowerCase().includes(query) ||
                v.description.toLowerCase().includes(query)
            );
            renderVacancies(filtered);
        }

        function openModal(title) {
            selectedVacancy = title;
            document.getElementById('modalTitle').innerText = 'Відгук: ' + title;
            document.getElementById('applyModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('applyModal').style.display = 'none';
            document.getElementById('applicantName').value = '';
            document.getElementById('applicantPhone').value = '';
            document.getElementById('applicantComment').value = '';
        }

        function submitForm() {
            const name = document.getElementById('applicantName').value.trim();
            const phone = document.getElementById('applicantPhone').value.trim();
            const comment = document.getElementById('applicantComment').value.trim();

            if (!name || !phone) {
                alert('Будь ласка, вкажіть ваші ім’я та контактний телефон!');
                return;
            }

            const btn = document.querySelector('.submit-btn');
            btn.innerText = 'Відправка...';
            btn.disabled = true;

            // Відправка даних через POST-запит на Apps Script -> звідти в Telegram і в таблицю
            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    vacancyTitle: selectedVacancy,
                    name: name,
                    phone: phone,
                    comment: comment
                })
            })
            .then(() => {
                btn.innerText = 'Відправити';
                btn.disabled = false;
                alert('Дякуємо! Ваша заявка успішно надіслана рекрутеру.');
                closeModal();
            })
            .catch(err => {
                btn.innerText = 'Відправити';
                btn.disabled = false;
                alert('Помилка відправки. Спробуйте ще раз.');
            });
        }
    </script>
</body>
</html>
